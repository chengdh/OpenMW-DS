name: Hybrid APK (upstream assets + CJK engine)

# The CJK build compiles the patched engine correctly, but AGP's asset merge
# silently drops the CMake-generated `assets/libopenmw/**` tree on this runner,
# which strips every engine resource (fonts, mygui layouts, shaders, defaults.bin)
# from the APK and makes the app crash on start.
#
# This workflow sidesteps the packaging problem entirely: it takes the upstream
# release APK (complete, correctly signed resource payload), swaps in the
# libopenmw.so produced by the CJK build, adds the bundled Chinese font, and
# re-signs. It is a verification vehicle, not a release pipeline.

on:
  workflow_dispatch:
    inputs:
      engine_run:
        description: "Actions run id that produced the openmw-ds-cjk-debug artifact"
        required: false
        default: "43234642079"
  push:
    branches: [ chinese-gbk-support ]
    paths:
      - .github/workflows/hybrid-apk.yml

permissions:
  contents: read
  actions: read

env:
  UPSTREAM_APK: https://github.com/Josh-Daniels/OpenMW-DS/releases/download/v1.4.0/OpenMW-DSv1.4.0.apk
  DEFAULT_ENGINE_RUN: "43234642079"

jobs:
  hybrid:
    name: hybrid (assets from upstream + patched engine)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve build-tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$SDK/build-tools/36.0.0"
          if [ ! -x "$BT/apksigner" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" >/dev/null
          fi
          echo "BT=$BT" >> "$GITHUB_ENV"
          "$BT/apksigner" --version

      # A cached keystore keeps the signature stable between runs, so the device
      # can install successive builds without uninstalling first.
      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.signing
          key: cjk-debug-keystore-v1

      - name: Fetch the patched libopenmw.so
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE_RUN: ${{ inputs.engine_run || '' }}
        run: |
          set -euo pipefail
          RUN="${ENGINE_RUN:-$DEFAULT_ENGINE_RUN}"
          echo "engine artifact from run $RUN"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n openmw-ds-cjk-debug -D art
          unzip -o -j art/app-debug.apk "lib/arm64-v8a/libopenmw.so" -d engine
          ls -l engine/libopenmw.so

      - name: Fetch the upstream release APK
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 -o upstream.apk "$UPSTREAM_APK"
          ls -l upstream.apk
          echo "engine assets in upstream: $(unzip -l upstream.apk | grep -c 'assets/libopenmw')"

      - name: Assemble and sign
        run: |
          set -euo pipefail
          mkdir -p stage/lib/arm64-v8a stage/assets/libopenmw/resources/vfs/fonts
          cp engine/libopenmw.so stage/lib/arm64-v8a/libopenmw.so
          cp app/src/main/cpp/openmw/cjk-fonts/fonts/zh_CN.omwfont stage/assets/libopenmw/resources/vfs/fonts/
          cp app/src/main/cpp/openmw/cjk-fonts/fonts/LXGWWenKaiGB-Regular.ttf stage/assets/libopenmw/resources/vfs/fonts/

          cp upstream.apk hybrid.apk
          ( cd stage && zip -q -X -r "$GITHUB_WORKSPACE/hybrid.apk" lib assets )

          "$BT/zipalign" -f -p 4 hybrid.apk aligned.apk

          KS="$GITHUB_WORKSPACE/.signing/debug.keystore"
          mkdir -p "$(dirname "$KS")"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          mkdir -p out
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out out/openmw-ds-hybrid-cjk.apk aligned.apk
          "$BT/apksigner" verify --print-certs out/openmw-ds-hybrid-cjk.apk | head -5

          echo "engine assets in hybrid APK: $(unzip -l out/openmw-ds-hybrid-cjk.apk | grep -c 'assets/libopenmw')"
          echo "cjk font in hybrid APK: $(unzip -l out/openmw-ds-hybrid-cjk.apk | grep -c 'zh_CN.omwfont')"
          ls -lh out

      - name: Upload hybrid APK
        uses: actions/upload-artifact@v4
        with:
          name: openmw-ds-hybrid-cjk
          path: ${{ github.workspace }}/out/*.apk
          if-no-files-found: error
