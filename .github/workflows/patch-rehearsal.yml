name: Patch rehearsal

# Replays the whole OPENMW_PATCH chain against the pinned engine tarball using the
# runner's own `patch` binary. The real build swallows every rejection with
# `|| true`, so a hunk that stops applying ships a silently broken engine and only
# surfaces 50 minutes later as "the feature does nothing". This job takes about a
# minute and fails loudly with the rejected hunk plus the surrounding source.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-rehearsal.yml'
      - 'app/src/main/cpp/openmw/patches/openmw/**.patch'
      - 'app/src/main/cpp/openmw/patches/mygui/**.patch'
      - 'app/src/main/cpp/openmw/CMakeLists.txt'

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned engine source
        run: |
          PIN=$(grep -oE 'b6b04ca[0-9a-f]{33}' app/src/main/cpp/openmw/CMakeLists.txt | head -1)
          echo "pin=$PIN"
          mkdir -p /tmp/engine
          curl -fsSL "https://github.com/sisah2/openmw/archive/$PIN.tar.gz" -o /tmp/engine.tgz
          tar -xzf /tmp/engine.tgz -C /tmp/engine --strip-components=1
          echo "src files: $(find /tmp/engine -type f | wc -l)"

      - name: Byte-level probe of the pump target
        run: |
          f=/tmp/engine/components/sdlutil/sdlinputwrapper.cpp
          echo "--- apply with --ignore-whitespace ---"
          rm -rf /tmp/engine_l && cp -R /tmp/engine /tmp/engine_l
          cd /tmp/engine_l
          patch -d . -p1 -t -N -l < "$GITHUB_WORKSPACE/app/src/main/cpp/openmw/patches/openmw/companion-command-pump.patch" 2>&1 | sed 's/^/    /'
          echo "--- the patch this runner generates ---"
          cd /tmp/engine
          cp components/sdlutil/sdlinputwrapper.cpp /tmp/orig.cpp
          python3 -c 'p="components/sdlutil/sdlinputwrapper.cpp"; s=open(p).read(); o="    void InputWrapper::capture(bool windowEventsOnly)\n    {\n"; assert o in s; open(p,"w").write(s.replace(o, o+"#ifdef __ANDROID__\n        drainCompanionCommands();\n#endif\n\n",1))'
          diff -u /tmp/orig.cpp components/sdlutil/sdlinputwrapper.cpp | sed 's|^--- /tmp/orig.cpp.*|--- a/components/sdlutil/sdlinputwrapper.cpp|; s|^+++ components.*|+++ b/components/sdlutil/sdlinputwrapper.cpp|' || true
          echo "--- generated patch applied to a clean tree ---"
          cp /tmp/orig.cpp components/sdlutil/sdlinputwrapper.cpp

      - name: Replay the patch chain
        run: |
          set -o pipefail
          set +e
          patch --version | head -2
          echo "-----------------------------"

          # Same order and flags as the CMake chain.
          grep -oE 'patches/openmw/[A-Za-z0-9._-]+\.patch' \
            app/src/main/cpp/openmw/CMakeLists.txt > /tmp/order.txt
          echo "patches in chain: $(wc -l < /tmp/order.txt)"

          FAILED=0
          KNOWN=0
          # These three hunks were already stale before this job existed: an earlier
          # patch in the chain rewrites the same region of windowmanagerimp.cpp /
          # inputmanagerimp.cpp, so their context no longer exists. They are tracked
          # here so a *new* rejection cannot hide behind them, and so the moment one
          # of them starts applying again we notice and drop it from the list.
          KNOWN_BROKEN=" companion-hide-dialogue-on-hideui.patch companion-hide-container-on-hideui.patch companion-gamecursor-suppress.patch "
          while read -r rel; do
            name=$(basename "$rel")
            out=$(cd /tmp/engine && patch -d . -p1 -t -N < "$GITHUB_WORKSPACE/app/src/main/cpp/openmw/$rel" 2>&1) || true
            if echo "$out" | grep -qE "FAILED|malformed|saving rejects"; then
              case "$KNOWN_BROKEN" in
                *" $name "*)
                  KNOWN=$((KNOWN+1))
                  echo "::warning::KNOWN-BROKEN (pre-existing, not blocking): $name"
                  echo "$out" | sed 's/^/    /'
                  continue
                  ;;
              esac
              FAILED=$((FAILED+1))
              echo "::error::REJECTED: $name"
              echo "$out" | sed 's/^/    /'
              for rej in $(cd /tmp/engine && find . -name '*.rej' 2>/dev/null); do
                echo "---- $rej (expected context) ----"
                head -40 "/tmp/engine/$rej"
                tgt="${rej%.rej}"
                echo "---- $tgt (actual content, +-6 lines around the hunk) ----"
                start=$(grep -m1 -oE '^@@ -[0-9]+' "/tmp/engine/$rej" | tr -dc '0-9')
                start=${start:-1}
                sed -n "$((start>6 ? start-6 : 1)),$((start+30))p" "/tmp/engine/$tgt"
                rm -f "/tmp/engine/$rej"
              done
            fi
          done < /tmp/order.txt

          echo "-----------------------------"
          echo "known-broken (ignored): $KNOWN"
          echo "rejected patches: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi

      - name: Assert the command pump really landed
        run: |
          f=/tmp/engine/components/sdlutil/sdlinputwrapper.cpp
          if grep -q "drainCompanionCommands();" "$f"; then
            echo "PUMP CALL PRESENT"; grep -n "drainCompanionCommands" "$f"
          else
            echo "::error::components/sdlutil/sdlinputwrapper.cpp never calls drainCompanionCommands() — every companion command from the bottom screen is dropped"
            exit 1
          fi

      - name: Assert CJK topic links landed
        run: |
          f=/tmp/engine/apps/openmw/mwdialogue/keywordsearch.cpp
          if grep -q "precededByWideChar" "$f"; then
            echo "CJK TOPIC LINKS PRESENT"; grep -n "precededByWideChar" "$f"
          else
            echo "::error::keywordsearch.cpp still requires a space before a keyword — inside a spaceless CJK sentence no topic is ever a clickable link, so the dialogue topic list stays empty"
            exit 1
          fi

      - name: Assert CJK typesetter line breaking landed
        run: |
          f=/tmp/engine/apps/openmw/mwgui/bookpage.cpp
          if grep -q "cjkBreakAllowed" "$f"; then
            echo "CJK TYPESETTER LINE BREAKING PRESENT"; grep -n "cjkBreakAllowed" "$f" | head -5
          else
            echo "::error::bookpage.cpp still only breaks in front of a whole word — a spaceless CJK paragraph is one word, so book and dialogue text is laid out as a single line running past the page edge"
            exit 1
          fi

      - name: Replay the MyGUI patch set
        run: |
          set -o pipefail
          VER=$(grep -oE 'MYGUI_VERSION [0-9.]+' app/src/main/cpp/openmw/CMakeLists.txt | awk '{print $2}' | head -1)
          echo "mygui version=$VER"
          mkdir -p /tmp/mygui
          curl -fsSL "https://github.com/MyGUI/mygui/archive/MyGUI${VER}.tar.gz" -o /tmp/mygui.tgz
          tar -xzf /tmp/mygui.tgz -C /tmp/mygui --strip-components=1
          echo "src files: $(find /tmp/mygui -type f | wc -l)"

          FAILED=0
          for p in app/src/main/cpp/openmw/patches/mygui/*.patch; do
            [ -e "$p" ] || continue
            name=$(basename "$p")
            if (cd /tmp/mygui && patch -d . -p1 -t -N < "$GITHUB_WORKSPACE/$p"); then
              echo "applied: $name"
            else
              FAILED=$((FAILED+1))
              echo "::error::REJECTED: $name"
            fi
          done
          echo "mygui rejected: $FAILED"
          [ "$FAILED" -eq 0 ]

      - name: Assert CJK line breaking landed
        run: |
          f=/tmp/mygui/MyGUIEngine/src/MyGUI_TextView.cpp
          # Assert on the real code change, not on a comment: the wrap condition must
          # no longer require a roll back point, and the no-rollback branch must exist.
          if grep -q "count > 0 && (width + char_fullAdvance) > _maxWidth" "$f" \
             && grep -q -A2 "if (!roll_back.empty())" "$f"; then
            echo "CJK LINE BREAK PRESENT"; grep -n "width + char_fullAdvance" "$f"
          else
            echo "::error::MyGUI TextView still refuses to break a line that has no space — long Chinese paragraphs will be clipped at the widget edge"
            exit 1
          fi
